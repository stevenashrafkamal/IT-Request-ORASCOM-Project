name: .NET Framework Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # 1. تجهيز أداة MSBuild (الخاصة بـ .NET Framework والـ Visual Studio)
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 2. تجهيز أداة NuGet التقليدية
    - name: Setup NuGet
      uses: nuget/setup-nuget@v1
      with:
        nuget-version: 'latest'

    # 3. عمل Restore للـ Packages باستخدام الـ NuGet التقليدي داخل فولدر الباكيند
    - name: Restore NuGet Packages
      working-directory: "./Backend (API)"
      run: nuget restore steven_ashraf.sln  # أو استبدله بـ اسم ملف الـ .csproj لو مفيش ملف .sln جوه الفولدر

    # 4. عمل Build للمشروع باستخدام MSBuild
    - name: Build Solution
      working-directory: "./Backend (API)"
      run: msbuild steven_ashraf.sln /p:Configuration=Release  # لو مفيش .sln اكتب steven_ashraf.csproj
